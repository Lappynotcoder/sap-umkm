services:
  # -------------------------------------------------------
  # APP — PHP-FPM (Laravel)
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sap_umkm_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Bind mount root folder agar update kode langsung terbaca
      - ./:/var/www/html
      # Anonymous volume untuk memproteksi folder vendor dari Dockerfile agar tidak tertimpa bind mount
      - /var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - sap_network
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  # -------------------------------------------------------
  # NGINX — Web Server
  # -------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: sap_umkm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Bind mount root folder secara read-only
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage:ro
    networks:
      - sap_network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 64M

  # -------------------------------------------------------
  # MARIADB — Database
  # -------------------------------------------------------
  mariadb:
    image: mariadb:11.2
    container_name: sap_umkm_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sap_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    command: >
      --innodb_buffer_pool_size=64M
      --innodb_log_file_size=16M
      --max_connections=50
      --query_cache_size=0
      --tmp_table_size=16M
      --max_heap_table_size=16M

  # -------------------------------------------------------
  # QUEUE — Laravel Queue Worker
  # -------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sap_umkm_queue
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Samakan dengan app agar antrean memproses kode terbaru
      - ./:/var/www/html
      - /var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - sap_network
    depends_on:
      mariadb:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    deploy:
      resources:
        limits:
          memory: 128M

# -------------------------------------------------------
# VOLUMES — Persistent data
# -------------------------------------------------------
volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
  bootstrap_cache:
    driver: local

# -------------------------------------------------------
# NETWORKS
# -------------------------------------------------------
networks:
  sap_network:
    driver: bridge
